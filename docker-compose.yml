version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./artifacts:/app/../artifacts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002

  frontend:
    build:
      context: ./frontend
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host --port 5175
    depends_on:
      - backend
